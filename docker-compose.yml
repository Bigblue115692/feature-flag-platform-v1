services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-featureflags}
      POSTGRES_USER: ${POSTGRES_USER:-featureflags}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-featureflags}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-featureflags} -d ${POSTGRES_DB:-featureflags}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    command: >
      sh -c "python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    expose:
      - "5173"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

  k6:
    image: grafana/k6:2.2.0
    profiles:
      - loadtest
    environment:
      BASE_URL: http://nginx
      RATE: ${K6_RATE:-10}
      DURATION: ${K6_DURATION:-15s}
      PRE_ALLOCATED_VUS: ${K6_PRE_ALLOCATED_VUS:-25}
      MAX_VUS: ${K6_MAX_VUS:-200}
      K6_WEB_DASHBOARD: "true"
      K6_WEB_DASHBOARD_HOST: 0.0.0.0
      K6_WEB_DASHBOARD_PORT: 5665
      K6_WEB_DASHBOARD_PERIOD: 1s
      K6_WEB_DASHBOARD_EXPORT: /load-tests/results/latest.html
      K6_LINGER: "false"
    volumes:
      - ./load-tests:/load-tests
    ports:
      - "5665:5665"
    depends_on:
      - nginx
    command: run /load-tests/k6/evaluate.js

volumes:
  postgres_data:
