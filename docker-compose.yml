services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:///./feature_flags.db
      ADMIN_API_KEY: dev-admin-key
      SDK_API_KEY: dev-sdk-key
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_ADMIN_API_KEY: dev-admin-key
      VITE_SDK_API_KEY: dev-sdk-key
    ports:
      - "5173:5173"
    depends_on:
      - backend
